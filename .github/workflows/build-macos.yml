name: Build ShowLyrics macOS (DMG)

# Trigger: push ke branch main, atau manual dari GitHub Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with DMG?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  build-macos:
    name: Build macOS App (arm64 native)
    runs-on: macos-14        # Apple Silicon M1 runner (ARM64 native)
    timeout-minutes: 90      # Batas 90 menit untuk seluruh job

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. CHECKOUT SOURCE CODE
      # ─────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1     # Shallow clone — lebih cepat

      # ─────────────────────────────────────────────────────────────
      # 2. SETUP TOOLS
      # ─────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Catatan: cache pip dinonaktifkan untuk menghindari
          # "No file matched" error jika requirements-macos.txt
          # tidak ditemukan pada shallow checkout
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-macos.txt'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: playback-engine/go.sum

      # ─────────────────────────────────────────────────────────────
      # 3. BUILD GO PLAYBACK ENGINE (arm64 — native M1)
      # ─────────────────────────────────────────────────────────────
      - name: Build Go Engine (arm64)
        run: |
          cd playback-engine
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o ../backend/playback-engine ./cmd/
          chmod +x ../backend/playback-engine
          echo "playback-engine info:"
          file ../backend/playback-engine
          echo "Size: $(du -sh ../backend/playback-engine | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 4. SETUP FFMPEG (arm64 — langsung dari zip atau download)
      # ─────────────────────────────────────────────────────────────
      - name: Setup FFmpeg macOS (arm64)
        run: |
          mkdir -p /tmp/ffmpeg-arm

          # Coba gunakan local zip file arm (ARM64) yang sudah ada di repo
          if [ -f "ffmpeg81arm.zip" ]; then
            echo "Using local ffmpeg81arm.zip from repository..."
            unzip -j -o "ffmpeg81arm.zip" -d /tmp/ffmpeg-arm
            echo "ARM64 ffmpeg extracted"
          fi

          # Cek juga Intel zip sebagai fallback (berjalan via Rosetta)
          if [ ! -f /tmp/ffmpeg-arm/ffmpeg ] && [ -f "ffmpeg80intel.zip" ]; then
            echo "ARM zip tidak ada/gagal, menggunakan Intel ffmpeg via Rosetta..."
            mkdir -p /tmp/ffmpeg-intel
            unzip -j -o "ffmpeg80intel.zip" -d /tmp/ffmpeg-intel
            cp /tmp/ffmpeg-intel/ffmpeg /tmp/ffmpeg-arm/ffmpeg
          fi

          # Download fallback jika keduanya tidak ada
          if [ ! -f /tmp/ffmpeg-arm/ffmpeg ]; then
            echo "Downloading FFmpeg arm64 dari osxexperts.net..."
            curl -L --retry 3 "https://www.osxexperts.net/ffmpeg7arm.zip" \
              -o /tmp/ffmpeg-arm64.zip
            unzip -j -o /tmp/ffmpeg-arm64.zip -d /tmp/ffmpeg-arm
          fi

          # Salin ke backend/
          cp /tmp/ffmpeg-arm/ffmpeg backend/ffmpeg
          chmod +x backend/ffmpeg

          echo "=== FFmpeg verification ==="
          file backend/ffmpeg
          echo "Size: $(du -sh backend/ffmpeg | cut -f1)"
          backend/ffmpeg -version 2>&1 | head -3

      # ─────────────────────────────────────────────────────────────
      # 5. VERIFY BINARIES DI BACKEND/
      # ─────────────────────────────────────────────────────────────
      - name: Verify binaries in backend/
        run: |
          echo "=== backend/ directory ==="
          ls -lh backend/
          echo ""
          for f in backend/ffmpeg backend/playback-engine; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(du -sh $f | cut -f1))"
              file "$f"
            else
              echo "ERROR: $f NOT FOUND!"
              exit 1
            fi
          done

      # ─────────────────────────────────────────────────────────────
      # 6. CONVERT ICON .ICO → .ICNS
      # ─────────────────────────────────────────────────────────────
      - name: Convert app.ico to app.icns
        run: |
          ICO="backend/app.ico"
          ICNS="src/app.icns"

          if [ -f "$ICNS" ]; then
            echo "app.icns already exists, skipping."
            exit 0
          fi

          if [ ! -f "$ICO" ]; then
            echo "WARNING: $ICO not found, akan dibuat placeholder"
            # Buat PNG placeholder 512x512
            python3 -c "
          from PIL import Image
          img = Image.new('RGBA', (512, 512), (30, 30, 46, 255))
          img.save('/tmp/icon_src.png')
          print('Placeholder created')
          "
            ICO="/tmp/icon_src.png"
          fi

          # Convert ICO/PNG → PNG dengan sips
          PNG="/tmp/app_icon.png"
          sips -s format png "$ICO" --out "$PNG" 2>/dev/null || cp "$ICO" "$PNG"

          # Build iconset
          ICONSET="/tmp/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz "$PNG" --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null 2>&1
            sz2=$((sz*2))
            sips -z $sz2 $sz2 "$PNG" --out "$ICONSET/icon_${sz}x${sz}@2x.png" > /dev/null 2>&1
          done

          iconutil -c icns "$ICONSET" -o "$ICNS" && echo "app.icns created: $(du -sh $ICNS | cut -f1)" || echo "iconutil gagal, skip"

      # ─────────────────────────────────────────────────────────────
      # 7. INSTALL PYTHON DEPENDENCIES
      # ─────────────────────────────────────────────────────────────
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements-macos.txt
          # Install PyInstaller versi terbaru yang stabil
          pip install "pyinstaller>=6.0.0,<7.0.0"
          echo "=== Installed packages ==="
          pip list | grep -E "PyInstaller|Pillow|av|fitz|uvicorn|fastapi"

      # ─────────────────────────────────────────────────────────────
      # 8. BUILD PYTHON BACKEND WITH PYINSTALLER
      #    target_arch=None → ikuti runner (arm64 di macos-14)
      #    Berjalan via Rosetta 2 di Mac Intel secara otomatis
      # ─────────────────────────────────────────────────────────────
      - name: Build Python Backend (PyInstaller arm64)
        working-directory: backend
        run: |
          echo "=== Pre-build check ==="
          ls -lh ffmpeg playback-engine
          echo ""
          echo "Starting PyInstaller..."
          pyinstaller ShowLyrics-macos.spec --clean --noconfirm

          echo ""
          echo "=== PyInstaller output ==="
          ls -lh dist/ShowLyrics/
          echo ""
          echo "=== bin/internal (sample) ==="
          ls dist/ShowLyrics/internal/ | head -20
          echo "Total size: $(du -sh dist/ShowLyrics/ | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 9. SETUP BIN DIRECTORY
      # ─────────────────────────────────────────────────────────────
      - name: Setup bin/ directory for Electron
        run: |
          rm -rf bin && mkdir -p bin

          # Copy PyInstaller output ke bin/
          cp -r backend/dist/ShowLyrics/* bin/

          # Pastikan semua binaries executable
          find bin/ -type f \( -name "ShowLyrics" -o -name "playback-engine" -o -name "ffmpeg" \) \
            -exec chmod +x {} \;

          echo "=== bin/ structure ==="
          ls -lh bin/
          echo "=== bin/internal (sample 20 files) ==="
          ls bin/internal/ 2>/dev/null | head -20
          echo "Total bin size: $(du -sh bin/ | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 10. INSTALL NODE DEPENDENCIES
      # ─────────────────────────────────────────────────────────────
      - name: Install Node Dependencies
        run: npm ci

      # ─────────────────────────────────────────────────────────────
      # 11. BUILD ELECTRON APP (DMG)
      # ─────────────────────────────────────────────────────────────
      - name: Build Electron macOS App (DMG)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # Skip code signing

      # ─────────────────────────────────────────────────────────────
      # 12. VERIFY OUTPUT
      # ─────────────────────────────────────────────────────────────
      - name: Verify Build Output
        run: |
          echo "=== dist/ artifacts ==="
          ls -lh dist/
          DMG_FILE=$(find dist/ -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "SUCCESS: $DMG_FILE ($(du -sh $DMG_FILE | cut -f1))"
          else
            echo "ERROR: No DMG found!"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # 13. UPLOAD ARTIFACTS
      # ─────────────────────────────────────────────────────────────
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowLyricsApp-macOS-DMG
          path: dist/*.dmg
          retention-days: 30

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShowLyricsApp-macOS-ZIP
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: ignore

      # ─────────────────────────────────────────────────────────────
      # 14. (OPSIONAL) CREATE GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: ShowLyricsApp v2.5.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
