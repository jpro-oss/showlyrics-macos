name: Build ShowLyrics macOS (Dual Arch)

# Trigger: push ke branch main, PR ke main, atau manual dari GitHub Actions tab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with both DMGs?'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # MATRIX BUILD: arm64 (macos-14) + x86_64 (macos-13) secara paralel
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false   # Jika 1 arch gagal, arch lain tetap jalan
      matrix:
        include:
          # Apple Silicon — macOS 15 Sequoia runner (ARM64 native)
          # macos-14 juga bisa dipakai, macos-15 lebih baru
          - os: macos-15
            arch: arm64
            go_arch: arm64
            ffmpeg_zip: ffmpeg81arm.zip
            ffmpeg_fallback_url: "https://www.osxexperts.net/ffmpeg7arm.zip"
            electron_arch: "--arm64"
            artifact_suffix: "arm64"

          # Intel Mac — macOS 15 Intel runner (x86_64 native)
          # PENTING: macos-13 sudah RETIRED (4 Des 2025) → gunakan macos-15-intel
          # Didukung hingga Agustus 2027 (Intel EOL dari Apple)
          - os: macos-15-intel
            arch: x86_64
            go_arch: amd64
            ffmpeg_zip: ffmpeg80intel.zip
            ffmpeg_fallback_url: "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
            electron_arch: "--x64"
            artifact_suffix: "x86_64"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─────────────────────────────────────────────────────────────
      # 2. SETUP TOOLS
      # ─────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-macos.txt'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: playback-engine/go.sum

      # ─────────────────────────────────────────────────────────────
      # 3. BUILD GO PLAYBACK ENGINE (arch sesuai matrix)
      # ─────────────────────────────────────────────────────────────
      - name: Build Go Engine (${{ matrix.arch }})
        run: |
          cd playback-engine
          GOOS=darwin GOARCH=${{ matrix.go_arch }} CGO_ENABLED=0 \
            go build -ldflags="-s -w" -o ../backend/playback-engine ./cmd/
          chmod +x ../backend/playback-engine
          echo "=== Go Engine ==="
          file ../backend/playback-engine
          echo "Size: $(du -sh ../backend/playback-engine | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 4. SETUP FFMPEG (arch sesuai matrix)
      # ─────────────────────────────────────────────────────────────
      - name: Setup FFmpeg (${{ matrix.arch }})
        run: |
          mkdir -p /tmp/ffmpeg-extract

          # Gunakan local zip jika ada di repo
          if [ -f "${{ matrix.ffmpeg_zip }}" ]; then
            echo "Using local ${{ matrix.ffmpeg_zip }} ..."
            unzip -j -o "${{ matrix.ffmpeg_zip }}" -d /tmp/ffmpeg-extract
          fi

          # Download fallback jika zip tidak ada atau gagal extract
          if [ ! -f /tmp/ffmpeg-extract/ffmpeg ]; then
            echo "Downloading FFmpeg ${{ matrix.arch }} dari fallback URL..."
            curl -L --retry 3 "${{ matrix.ffmpeg_fallback_url }}" \
              -o /tmp/ffmpeg-download.zip
            unzip -j -o /tmp/ffmpeg-download.zip -d /tmp/ffmpeg-extract
          fi

          # Salin ke backend/
          if [ -f /tmp/ffmpeg-extract/ffmpeg ]; then
            cp /tmp/ffmpeg-extract/ffmpeg backend/ffmpeg
            chmod +x backend/ffmpeg
          else
            echo "ERROR: FFmpeg tidak berhasil di-extract!"
            exit 1
          fi

          echo "=== FFmpeg verification ==="
          file backend/ffmpeg
          echo "Size: $(du -sh backend/ffmpeg | cut -f1)"
          backend/ffmpeg -version 2>&1 | head -3

      # ─────────────────────────────────────────────────────────────
      # 5. VERIFY BINARIES DI BACKEND/
      # ─────────────────────────────────────────────────────────────
      - name: Verify backend/ binaries
        run: |
          echo "=== backend/ listing ==="
          ls -lh backend/
          for f in backend/ffmpeg backend/playback-engine; do
            if [ -f "$f" ]; then
              echo "OK: $f | arch: $(file $f | grep -o 'arm64\|x86_64\|Mach-O')"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

      # ─────────────────────────────────────────────────────────────
      # 6. CONVERT ICON .ICO → .ICNS
      # ─────────────────────────────────────────────────────────────
      - name: Convert app.ico to app.icns
        run: |
          ICO="backend/app.ico"
          ICNS="src/app.icns"

          if [ -f "$ICNS" ]; then
            echo "app.icns already exists, skip."
            exit 0
          fi

          # Fallback placeholder jika tidak ada ico
          if [ ! -f "$ICO" ]; then
            echo "WARNING: $ICO not found, creating placeholder..."
            python3 -c "
          from PIL import Image
          img = Image.new('RGBA', (512, 512), (30, 30, 46, 255))
          img.save('/tmp/icon_src.png')
          "
            ICO="/tmp/icon_src.png"
          fi

          PNG="/tmp/app_icon.png"
          sips -s format png "$ICO" --out "$PNG" 2>/dev/null || cp "$ICO" "$PNG"

          ICONSET="/tmp/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz "$PNG" --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null 2>&1
            sz2=$((sz*2))
            sips -z $sz2 $sz2 "$PNG" --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null 2>&1
          done

          iconutil -c icns "$ICONSET" -o "$ICNS" \
            && echo "app.icns created: $(du -sh $ICNS | cut -f1)" \
            || echo "WARNING: iconutil gagal, electron-builder akan menggunakan default icon"

      # ─────────────────────────────────────────────────────────────
      # 7. INSTALL PYTHON DEPENDENCIES
      # ─────────────────────────────────────────────────────────────
      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r backend/requirements-macos.txt
          pip install "pyinstaller>=6.0.0,<7.0.0"
          echo "=== Key packages ==="
          pip list | grep -E "PyInstaller|Pillow|PyAV|PyMuPDF|uvicorn|fastapi|pydantic"

      # ─────────────────────────────────────────────────────────────
      # 8. BUILD PYTHON BACKEND (PyInstaller — arch sesuai runner)
      #    target_arch=None → ikuti arsitektur runner secara otomatis
      #    macos-14 → arm64, macos-13 → x86_64
      # ─────────────────────────────────────────────────────────────
      - name: Build Python Backend (PyInstaller ${{ matrix.arch }})
        working-directory: backend
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "=== Pre-build check ==="
          file ffmpeg playback-engine
          echo ""
          echo "=== Starting PyInstaller (${{ matrix.arch }}) ==="
          ARCH=${{ matrix.arch }} pyinstaller ShowLyrics-macos.spec --clean --noconfirm

          echo ""
          echo "=== Output ==="
          ls -lh dist/ShowLyrics/
          echo "Total: $(du -sh dist/ShowLyrics/ | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 9. SETUP BIN/
      # ─────────────────────────────────────────────────────────────
      - name: Setup bin/ for Electron
        run: |
          rm -rf bin && mkdir -p bin
          cp -r backend/dist/ShowLyrics/* bin/
          find bin/ -type f \( -name "ShowLyrics" -o -name "playback-engine" -o -name "ffmpeg" \) \
            -exec chmod +x {} \;

          echo "=== bin/ ==="
          ls -lh bin/
          echo "=== bin/internal (sample) ==="
          ls bin/internal/ 2>/dev/null | head -15
          echo "Total: $(du -sh bin/ | cut -f1)"

      # ─────────────────────────────────────────────────────────────
      # 10. INSTALL NODE DEPENDENCIES
      # ─────────────────────────────────────────────────────────────
      - name: Install Node Dependencies
        run: npm ci

      # ─────────────────────────────────────────────────────────────
      # 11. BUILD ELECTRON APP BUNDLE
      #     Strategi: build dengan target 'dir' dulu (hanya .app bundle)
      #     MENGAPA: electron-builder 24.x + macOS 15 Sequoia punya bug
      #     hdiutil dimana disk image tidak bisa di-detach (Resource busy)
      #     saat build DMG. Target 'dir' tidak pakai hdiutil sama sekali.
      # ─────────────────────────────────────────────────────────────
      - name: Build Electron App Bundle (${{ matrix.arch }})
        timeout-minutes: 20
        run: |
          echo "Building Electron app bundle for ${{ matrix.arch }}..."
          # Build hanya .app bundle (tidak langsung jadi DMG/ZIP)
          # --publish never: nonaktifkan semua publish/upload ke GitHub
          npx electron-builder --mac dir ${{ matrix.electron_arch }} --publish never

          echo ""
          echo "=== App bundle output ==="
          APP_DIR=$(find dist/ -name "*.app" -maxdepth 3 | head -1)
          if [ -n "$APP_DIR" ]; then
            echo "OK: $APP_DIR ($(du -sh "$APP_DIR" | cut -f1))"
          else
            echo "ERROR: .app bundle tidak ditemukan!"
            ls -lhR dist/
            exit 1
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ─────────────────────────────────────────────────────────────
      # 11b. CREATE DMG dengan create-dmg (tidak pakai hdiutil internal)
      #      create-dmg adalah Homebrew tool yang lebih reliable di macOS 15
      # ─────────────────────────────────────────────────────────────
      - name: Create DMG (${{ matrix.arch }})
        timeout-minutes: 10
        run: |
          # Install create-dmg (ringan, sudah ada di Homebrew macOS runner)
          brew install create-dmg 2>/dev/null || true

          APP_DIR=$(find dist/ -name "*.app" -maxdepth 3 | head -1)
          DMG_NAME="ShowLyricsApp-2.5.0-${{ matrix.artifact_suffix }}.dmg"
          DMG_PATH="dist/$DMG_NAME"

          echo "Creating DMG: $DMG_PATH from $APP_DIR"

          create-dmg \
            --volname "ShowLyricsApp" \
            --window-pos 200 120 \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "ShowLyricsApp.app" 130 200 \
            --hide-extension "ShowLyricsApp.app" \
            --app-drop-link 410 200 \
            "$DMG_PATH" \
            "$APP_DIR" \
            || {
              echo "WARNING: create-dmg gagal, membuat ZIP sebagai fallback..."
              cd dist
              ZIP_NAME="ShowLyricsApp-2.5.0-${{ matrix.artifact_suffix }}.zip"
              ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_DIR")" "$ZIP_NAME"
              cd ..
              echo "OK: Fallback ZIP dibuat: dist/$ZIP_NAME"
            }

          echo ""
          echo "=== dist/ artifacts ==="
          ls -lh dist/*.dmg dist/*.zip 2>/dev/null || ls -lh dist/

      # ─────────────────────────────────────────────────────────────
      # 12. VERIFY OUTPUT
      # ─────────────────────────────────────────────────────────────
      - name: Verify Build Output (${{ matrix.arch }})
        run: |
          echo "=== dist/ final artifacts ==="
          ls -lh dist/

          # Cek DMG atau ZIP (salah satu harus ada)
          DMG_FILE=$(find dist/ -maxdepth 1 -name "*.dmg" | head -1)
          ZIP_FILE=$(find dist/ -maxdepth 1 -name "*.zip" | head -1)

          if [ -n "$DMG_FILE" ]; then
            echo "SUCCESS: DMG = $DMG_FILE ($(du -sh "$DMG_FILE" | cut -f1))"
          elif [ -n "$ZIP_FILE" ]; then
            echo "SUCCESS: ZIP = $ZIP_FILE ($(du -sh "$ZIP_FILE" | cut -f1))"
          else
            echo "ERROR: Tidak ada DMG maupun ZIP di dist/!"
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # 13. UPLOAD ARTIFACTS (per-arch)
      # ─────────────────────────────────────────────────────────────
      - name: Upload DMG (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ShowLyricsApp-macOS-${{ matrix.artifact_suffix }}-DMG
          path: dist/*.dmg
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload ZIP (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ShowLyricsApp-macOS-${{ matrix.artifact_suffix }}-ZIP
          path: dist/*.zip
          retention-days: 30
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # (OPSIONAL) CREATE RELEASE — hanya jika workflow_dispatch create_release=true
  # ═══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Create GitHub Release
    needs: build-macos
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: ShowLyricsApp-macOS-*-DMG
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Release assets ==="
          find release-assets/ -name "*.dmg" | sort
          DMG_COUNT=$(find release-assets/ -name "*.dmg" | wc -l)
          echo "Total DMGs: $DMG_COUNT"
          if [ "$DMG_COUNT" -eq 0 ]; then
            echo "ERROR: No DMG files found for release!"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-build.${{ github.run_number }}
          name: ShowLyricsApp v2.5.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            release-assets/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
