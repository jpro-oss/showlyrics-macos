<!DOCTYPE html>
<html lang="en">

<head>
    <title>Presentation Engine</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }

        #ppt-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .ppt-viewer {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            will-change: opacity;
        }

        .ppt-viewer.active {
            opacity: 1;
        }

        /* Hide broken/missing images completely */
        .ppt-viewer[data-broken="true"],
        img:not([src]),
        img[src=""],
        img[src="null"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>
    <div id="ppt-container">
        <img id="ppt-viewer-1" class="ppt-viewer" data-broken="false">
        <img id="ppt-viewer-2" class="ppt-viewer" data-broken="false">
    </div>
    <script src="/static/ppt.js?v={{ VERSION }}"></script>
</body>

</html>
