<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripture Display (VJ Canvas)</title>
    <style>
        :root {
            /* Variabel default visual (Diatur PX oleh JS config) */
            --scr-bg-color: transparent;
            --scr-bg-blur: 0px;
            --scr-full-bg-color: transparent;
            --scr-full-bg-blur: 0px;

            --scr-overlay-height: 380px;
            --scr-overlay-radius: 15px;
            --scr-margin-x: 40px;
            --scr-margin-y: 40px;

            --scr-title-font: 'Montserrat', sans-serif;
            --scr-title-size: 28px;
            --scr-title-color: #00e5ff;
            --scr-title-align: left;
            --scr-title-pad: 15px 20px 15px 20px;

            --scr-body-font: 'Montserrat', sans-serif;
            --scr-body-size: 45px;
            --scr-body-color: #ffffff;
            --scr-body-align: left;
            --scr-body-pad: 20px 30px 20px 30px;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }

        /* 🎯 LATAR UNTUK FULLSCREEN */
        #scr-full-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--scr-full-bg-color);
            backdrop-filter: var(--scr-full-bg-blur);
            -webkit-backdrop-filter: var(--scr-full-bg-blur);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: 1;
            will-change: opacity;
        }

        #scr-full-bg.show {
            opacity: 1;
        }

        /* 🎯 PEMBUNGKUS UTAMA */
        #scripture-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            z-index: 2;
            will-change: opacity;
        }

        #scripture-layer.show {
            opacity: 1;
        }

        /* 🎯 KOTAK LOGIKA 1920px (Hardcoded). Dilarang responsif width/height. */
        .scr-wrapper {
            width: 1920px;
            height: var(--scr-overlay-height);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            /* transform dan origin diatur oleh JS scaling */
            will-change: transform;
        }

        /* Kotak Warna/Radius Overlay */
        .scr-content-box {
            width: calc(100% - (var(--scr-margin-x) * 2));
            height: calc(100% - (var(--scr-margin-y) * 2));
            margin: var(--scr-margin-y) var(--scr-margin-x);

            background-color: var(--scr-bg-color);
            backdrop-filter: var(--scr-bg-blur);
            -webkit-backdrop-filter: var(--scr-bg-blur);
            border-radius: var(--scr-overlay-radius);

            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* --- TIPOGRAFI --- */
        .scr-title-box {
            font-family: var(--scr-title-font);
            font-size: var(--scr-title-size);
            color: var(--scr-title-color);
            text-align: var(--scr-title-align);
            padding: var(--scr-title-pad);
            box-sizing: border-box;
            flex-shrink: 0;
            font-weight: bold;
        }

        .scr-body-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: var(--scr-body-pad);
            box-sizing: border-box;
            overflow: hidden;
        }

        .scr-body-box {
            font-family: var(--scr-body-font);
            color: var(--scr-body-color);
            text-align: var(--scr-body-align);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        #scr-v1,
        #scr-v2 {
            font-size: var(--scr-body-size);
        }

        #scr-v2 {
            opacity: 0.8;
            margin-top: 15px;
        }

        /* Samakan besar, keredupan beda */

        .te-hidden {
            display: none !important;
        }

        .scr-version-label {
            font-size: 0.55em;
            opacity: 0.8;
            margin-right: 8px;
            vertical-align: super;
            font-weight: 900;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div id="scr-full-bg"></div>

    <div id="scripture-layer">
        <div class="scr-wrapper" id="scr-wrapper">
            <div class="scr-content-box" id="scr-overlay-box">
                <div class="scr-title-box" id="scr-title"></div>

                <div class="scr-body-container" id="scr-container">
                    <div class="scr-body-box">
                        <div id="scr-v1"></div>
                        <div id="scr-v2" class="te-hidden"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/scripture.js?v={{ VERSION }}"></script>
</body>

</html>
