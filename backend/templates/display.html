<!DOCTYPE html>
<html>

<head>
    <link id="google-font-link" rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=Courier+Prime:wght@700&display=swap">
    <style>
        /* 🎯 TAMBAHAN: LAYER IFRAME SCRIPTURE */
        /* --- SCRIPTURE IFRAME DI DISPLAY.HTML --- */
        .scripture-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            border: none;
            z-index: 9999;
            pointer-events: none;
            /* Klik tembus ke layar bawah */
        }

        .cam-output-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 1;
            pointer-events: none;
            background: transparent;
        }

        :root {
            --glow-color: rgba(255, 255, 255, 0.8);
            --main-color: #ffffff;
            --fade-speed: 0.8s;
            --main-font: 'Montserrat', sans-serif;
            --main-font-size: 5vw;
            /* <--- INI TAMBAHANNYA */
        }

        html,
        body {
            background-color: transparent;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            perspective: 1000px;
        }

        #scene-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            will-change: transform;
        }

        .move-in {
            animation: moveZoomIn 20s linear infinite alternate;
        }

        .move-out {
            animation: moveZoomOut 20s linear infinite alternate;
        }

        .move-stay {
            animation: moveDrift 15s ease-in-out infinite alternate;
        }

        @keyframes moveZoomIn {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }

        @keyframes moveZoomOut {
            0% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes moveDrift {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ========================================== */
        /* ARSITEKTUR BARU: WRAPPER KEMBAR SIAM       */
        /* ========================================== */
        .lyric-group {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            box-sizing: border-box;
        }

        .lyric-group.active {
            opacity: 1;
        }

        .lyric-wrapper {
            position: relative;
            display: flex;
            /* Bikin ngepres dengan text */
            align-items: center;
            overflow: visible;
            min-height: 0;
        }

        .lyric-text,
        .lyric-ghost {
            font-family: var(--main-font);
            font-size: var(--main-font-size);
            line-height: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            word-break: normal;
        }

        .lyric-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        .lyric-text {
            position: relative;
            z-index: 2;
            margin: 0;
            line-height: 1;
            word-wrap: break-word;
            overflow-wrap: break-word;
            will-change: filter, transform;
            transform: translateZ(0);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            padding: 0;
        }

        .lyric-ghost {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            will-change: filter, opacity;
            transform: translateZ(0);
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.02);
            }
        }

        /* ============================== */
        /* THEMES CSS                     */
        /* ============================== */
        .theme-default {
            color: var(--main-color);
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px var(--main-color), 0 0 100px var(--main-color), 0 0 150px var(--main-color);
        }

        .theme-box-black {
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.6);
            padding: 25px 60px;
            border-radius: 15px;
            display: inline-block;
            width: auto;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .theme-frosted {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            border-radius: 15px;
            display: inline-block;
            width: auto;
            padding: 25px 60px;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 255, 255, 0.3);
        }

        .theme-clean {
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.6), 0 0 90px rgba(255, 255, 255, 0.4);
            font-weight: 700;
        }

        .theme-pure {
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(255, 255, 255, 0.7);
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
        }

        .theme-plain {
            color: var(--main-color) !important;
            text-shadow: none !important;
            background: none !important;
            filter: none !important;
            -webkit-text-stroke: 0 !important;
        }

        .theme-thin {
            font-weight: 300;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.6);
        }

        .theme-bold {
            font-weight: 900;
            letter-spacing: -2px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.8);
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.6);
        }

        .theme-soft {
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 60px rgba(255, 255, 255, 0.6), 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .theme-heaven {
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(0, 150, 255, 0.8), 0 0 100px rgba(0, 150, 255, 0.6);
        }

        .theme-gold {
            background: linear-gradient(to bottom, #fbf5b7 0%, #bf953f 50%, #b38728 51%, #fbf5b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 180, 0, 0.6));
            color: transparent !important;
        }

        .theme-mist {
            color: rgba(255, 255, 255, 0.9);
            filter: blur(0.5px);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(255, 255, 255, 0.6);
        }

        .theme-ocean {
            color: #e0ffff;
            text-shadow: 0 0 20px #00aaaa, 0 0 50px #00aaaa, 0 0 100px #004444;
        }

        .theme-sunset {
            background: linear-gradient(180deg, #ffcc00 0%, #ff6666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 25px rgba(255, 100, 0, 0.8)) drop-shadow(0 0 50px rgba(200, 50, 0, 0.6));
            color: transparent !important;
        }

        .theme-majesty {
            color: #f8f0ff;
            text-shadow: 0 0 25px #bf00ff, 0 0 50px #bf00ff, 0 0 100px #4b0082;
        }

        .theme-nature {
            background: linear-gradient(180deg, #a8ff78 0%, #78ffd6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 20px rgba(0, 255, 100, 0.8)) drop-shadow(0 0 40px rgba(0, 150, 50, 0.6));
            color: transparent !important;
        }

        .theme-neon {
            color: transparent;
            -webkit-text-stroke: 2px #00ffcc;
            filter: drop-shadow(0 0 15px #00ffcc) drop-shadow(0 0 30px #00ffcc) drop-shadow(0 0 60px #00ffcc);
        }

        .theme-fire {
            color: #fff;
            text-shadow: 0 -3px 10px #ffdd00, 0 -8px 25px #ff6600, 0 -15px 50px #ff0000, 0 -25px 75px #cc0000;
        }

        .theme-electric {
            color: #ffff00;
            font-style: italic;
            text-shadow: 4px 4px 0px #0000ff, 0 0 20px #ffff00, 0 0 40px #0000ff;
            transform: skewX(-10deg);
        }

        .theme-cyberpunk {
            color: #fff;
            text-shadow: 3px 0px 0px #00e5ff, -3px 0px 0px #ff0055, 0 0 25px #00e5ff, 0 0 50px #ff0055;
            letter-spacing: 2px;
        }

        .theme-hologram {
            background: linear-gradient(135deg, #8EC5FC 0%, #E0C3FC 50%, #ff9a9e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 0 20px rgba(200, 200, 255, 0.8)) drop-shadow(0 0 40px rgba(255, 150, 200, 0.6));
            color: transparent !important;
        }

        .theme-retro {
            background: -webkit-linear-gradient(#ff00cc, #333399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            -webkit-text-stroke: 1px #fff;
            filter: drop-shadow(3px 3px 0px rgba(255, 255, 255, 0.3));
            color: transparent !important;
        }

        .theme-metal {
            background: linear-gradient(to bottom, #e0e0e0 0%, #5d5d5d 50%, #333333 51%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.8));
            color: transparent !important;
        }

        .theme-glass {
            color: rgba(255, 255, 255, 0.1);
            -webkit-text-stroke: 1.5px #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .theme-3d {
            color: #fff;
            text-shadow: 0 1px 0 #ccc, 0 2px 0 #c9c9c9, 0 3px 0 #bbb, 0 4px 0 #aaa, 0 5px 0 #999, 0 6px 1px rgba(0, 0, 0, .1), 0 0 5px rgba(0, 0, 0, .1), 0 1px 3px rgba(0, 0, 0, .3), 0 3px 5px rgba(0, 0, 0, .2), 0 15px 20px rgba(0, 0, 0, .35);
        }

        .theme-ice {
            color: #f0f8ff;
            text-shadow: 0 0 10px #00ffff, 0 0 25px #00bfff;
            letter-spacing: 2px;
        }

        .theme-outline {
            color: transparent;
            -webkit-text-stroke: 2.5px #ffffff;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        }

        .theme-comic {
            color: #ffeb3b;
            -webkit-text-stroke: 3px #000;
            text-shadow: 5px 5px 0px #000;
            font-weight: 900;
            transform: skewX(-5deg);
        }

        .theme-arcade {
            color: #00ff00;
            text-shadow: 4px 4px 0px #003300;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            letter-spacing: -2px;
        }

        .theme-matrix {
            color: #00ff00;
            text-shadow: 0 0 8px #00ff00;
            font-family: 'Courier Prime', monospace;
            letter-spacing: 2px;
        }

        .theme-horror {
            color: #ff0000;
            text-shadow: 0 0 10px #8b0000, 0 20px 20px #000;
            filter: contrast(1.5);
        }

        .theme-paper {
            color: #000;
            background: #fff;
            padding: 10px 30px;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.3);
            transform: rotate(-2deg);
            display: inline-block;
            width: auto;
            border-radius: 4px;
        }

        /* HIDE GHOST FOR CLEAN STYLES */
        .theme-box-black .lyric-ghost,
        .theme-frosted .lyric-ghost,
        .theme-clean .lyric-ghost,
        .theme-pure .lyric-ghost,
        .theme-paper .lyric-ghost,
        .theme-plain .lyric-ghost {
            display: none !important;
        }

        /* ============================== */
        /* MASTER ANTI-GAP FIX: ALL EFFECTS */
        /* Suppress height expansion pada bilingual */
        /* ============================== */
        .fx-bloom .lyric-wrapper,
        .fx-bloom .bilingual-line,
        .fx-smoke .lyric-wrapper,
        .fx-smoke .bilingual-line,
        .fx-light .lyric-wrapper,
        .fx-light .bilingual-line,
        .fx-softfocus .lyric-wrapper,
        .fx-softfocus .bilingual-line,
        .fx-float .lyric-wrapper,
        .fx-float .bilingual-line,
        .fx-punch .lyric-wrapper,
        .fx-punch .bilingual-line,
        .fx-elastic .lyric-wrapper,
        .fx-elastic .bilingual-line,
        .fx-flashpop .lyric-wrapper,
        .fx-flashpop .bilingual-line,
        .fx-whip .lyric-wrapper,
        .fx-whip .bilingual-line,
        .fx-gdrop .lyric-wrapper,
        .fx-gdrop .bilingual-line,
        .fx-dust .lyric-wrapper,
        .fx-dust .bilingual-line,
        .fx-lens .lyric-wrapper,
        .fx-lens .bilingual-line,
        .fx-wipe .lyric-wrapper,
        .fx-wipe .bilingual-line,
        .fx-abyss .lyric-wrapper,
        .fx-abyss .bilingual-line,
        .fx-aurora .lyric-wrapper,
        .fx-aurora .bilingual-line,
        .fx-rgb .lyric-wrapper,
        .fx-rgb .bilingual-line,
        .fx-shake .lyric-wrapper,
        .fx-shake .bilingual-line,
        .fx-smash .lyric-wrapper,
        .fx-smash .bilingual-line,
        .fx-slash .lyric-wrapper,
        .fx-slash .bilingual-line,
        .fx-terminal .lyric-wrapper,
        .fx-terminal .bilingual-line {
            line-height: 1 !important;
            overflow: visible !important;
            align-items: center !important;
        }

        /* ============================== */
        /* FX LIBRARY (TARGET WRAPPER!)   */
        /* Melindungi Inline Glow Filter  */
        /* ============================== */
        /* ANIMASI LAYER PENUH (Biasa) */
        .fx-fade .lyric-wrapper {
            animation: fadeIn var(--fade-speed) ease-in-out forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .fx-track .lyric-wrapper {
            animation: trackIn var(--fade-speed) ease-out forwards;
        }

        @keyframes trackIn {
            0% {
                letter-spacing: 0.3em;
                opacity: 0;
                filter: blur(10px);
            }

            100% {
                letter-spacing: normal;
                opacity: 1;
                filter: blur(0);
            }
        }

        .fx-blur .lyric-wrapper {
            animation: blurIn var(--fade-speed) cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes blurIn {
            0% {
                filter: blur(30px);
                transform: scale(1.1);
                opacity: 0;
            }

            100% {
                filter: blur(0);
                transform: scale(1);
                opacity: 1;
            }
        }

        .fx-mask .lyric-wrapper {
            animation: maskRise var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes maskRise {
            0% {
                clip-path: inset(100% -50% -50% -50%);
                transform: translateY(60px);
                opacity: 0;
            }

            100% {
                clip-path: inset(-50% -50% -50% -50%);
                transform: translateY(0);
                opacity: 1;
            }
        }

        .fx-burst .lyric-wrapper {
            animation: glowBurst var(--fade-speed) ease-out forwards;
        }

        @keyframes glowBurst {
            0% {
                opacity: 0;
                transform: scale(0.9);
                filter: brightness(3);
            }

            40% {
                opacity: 1;
                transform: scale(1.05);
                filter: brightness(2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        .fx-echo .lyric-wrapper {
            animation: echoMerge var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes echoMerge {
            0% {
                opacity: 0;
                transform: scale(2);
                filter: blur(20px);
                letter-spacing: 0.2em;
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
                letter-spacing: normal;
            }
        }

        .fx-flip3d .lyric-wrapper {
            animation: flipDown var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: top center;
        }

        @keyframes flipDown {
            0% {
                opacity: 0;
                transform: rotateX(-90deg);
            }

            100% {
                opacity: 1;
                transform: rotateX(0deg);
            }
        }

        .fx-slide .lyric-wrapper {
            animation: motionSlide var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes motionSlide {
            0% {
                opacity: 0;
                transform: translateX(-150px) skewX(-20deg);
            }

            100% {
                opacity: 1;
                transform: translateX(0) skewX(0);
            }
        }

        .fx-focus .lyric-wrapper {
            animation: focusExp var(--fade-speed) ease-out forwards;
        }

        @keyframes focusExp {
            0% {
                opacity: 0;
                letter-spacing: -0.2em;
                filter: blur(15px);
                transform: scale(0.9);
            }

            100% {
                opacity: 1;
                letter-spacing: normal;
                filter: blur(0);
                transform: scale(1);
            }
        }

        .fx-neon .lyric-wrapper {
            animation: neonOn var(--fade-speed) linear forwards;
        }

        @keyframes neonOn {

            0%,
            10%,
            20% {
                opacity: 0;
                filter: brightness(0);
            }

            15%,
            30% {
                opacity: 0.4;
                filter: brightness(0.5);
            }

            25%,
            35% {
                opacity: 1;
                filter: brightness(2);
            }

            100% {
                opacity: 1;
                filter: brightness(1);
            }
        }

        .fx-pop .lyric-wrapper {
            animation: elasticPop var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: center center;
        }

        @keyframes elasticPop {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fx-stretch .lyric-wrapper {
            animation: cinemaStretch var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform-origin: center center;
        }

        @keyframes cinemaStretch {
            0% {
                opacity: 0;
                transform: scaleY(0) scaleX(1.2);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scaleY(1) scaleX(1);
                filter: blur(0);
            }
        }

        .fx-cinema .lyric-wrapper {
            animation: cinemaZoom var(--fade-speed) ease-out forwards;
        }

        @keyframes cinemaZoom {
            0% {
                opacity: 0;
                transform: scale(1.3);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .fx-swipe .lyric-wrapper {
            animation: swipeRight var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes swipeRight {
            0% {
                clip-path: inset(0 100% 0 0);
                transform: translateX(-20px);
                opacity: 0;
            }

            100% {
                clip-path: inset(0 0 0 0);
                transform: translateX(0);
                opacity: 1;
            }
        }

        .fx-stamp .lyric-wrapper {
            animation: stampIn var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes stampIn {
            0% {
                opacity: 0;
                transform: scale(3);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        .fx-elevator .lyric-wrapper {
            animation: elevatorUp var(--fade-speed) cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes elevatorUp {
            0% {
                opacity: 0;
                transform: translateY(100%);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fx-swivel .lyric-wrapper {
            animation: swivelIn var(--fade-speed) ease-out forwards;
            transform-origin: center;
        }

        @keyframes swivelIn {
            0% {
                opacity: 0;
                transform: rotateY(-90deg);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: rotateY(0deg);
                filter: blur(0);
            }
        }

        .fx-fold .lyric-wrapper {
            animation: foldDown var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            transform-origin: top center;
        }

        @keyframes foldDown {
            0% {
                opacity: 0;
                transform: rotateX(90deg);
            }

            100% {
                opacity: 1;
                transform: rotateX(0);
            }
        }

        .fx-turb .lyric-wrapper {
            animation: turbIn var(--fade-speed) linear forwards;
        }

        @keyframes turbIn {
            0% {
                opacity: 0;
                transform: scale(1.1) translateX(-10px);
                filter: blur(5px);
            }

            40% {
                transform: translateX(-5px);
            }

            80% {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .fx-drop .lyric-wrapper {
            animation: dropBounce var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropBounce {
            0% {
                opacity: 0;
                transform: translateY(-100vh);
            }

            60% {
                opacity: 1;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========================================= */
        /* --- BASE ALIGNMENT FIX: ANTI-GAP BILINGUAL --- */
        /* ========================================= */
        .word,
        .char {
            vertical-align: baseline !important;
            line-height: 1 !important;
            display: inline-block;
            margin: 0 !important;
            padding: 0 !important;
            font-size: 1em;
        }

        /* ANTI-GAP FIX: BILINGUAL TEXT CONTAINER */
        .main-lang,
        .sub-lang {
            display: block;
            line-height: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            min-height: 0;
            overflow: visible;
            text-align: inherit;
            text-decoration: inherit;
            width: auto;
        }

        .main-lang {
            font-size: var(--main-font-size);
            transform: translateY(0);
        }

        .sub-lang {
            font-size: calc(var(--main-font-size) * 0.6);
            pointer-events: none;
            transform: translateY(0);
            margin-top: 0 !important;
        }

        /* NEW: BILINGUAL LINE WRAPPER - FLEX BASED ALIGNMENT */
        .bilingual-line {
            display: inline-flex;
            flex-direction: column;
            align-items: inherit;
            justify-content: center;
            gap: 0.1em;
            min-height: 0;
            overflow: visible;
            width: auto;
            margin: 0;
            position: relative;
            text-align: inherit;
        }

        /* ========================================= */
        /* ENHANCED ANTI-GAP: WORD/CHAR BASELINE FIX */
        /* Suppress height expansion pada bilingual */
        /* ========================================= */

        /* CINEMATIC WORSHIP: Per-Word Effects */
        .fx-bloom .word,
        .fx-smoke .word,
        .fx-light .word,
        .fx-softfocus .word,
        .fx-float .word {
            vertical-align: baseline !important;
            line-height: 1 !important;
            display: inline-block;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ENERGETIC PRAISE: Per-Char Effects */
        .fx-punch .char,
        .fx-elastic .char,
        .fx-flashpop .char,
        .fx-whip .char,
        .fx-gdrop .char,
        .fx-rgb .char,
        .fx-shake .char,
        .fx-smash .char,
        .fx-slash .char,
        .fx-terminal .char {
            vertical-align: baseline !important;
            line-height: 1 !important;
            display: inline-block;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* AE CINEMATIC: Per-Word Effects */
        .fx-dust .word,
        .fx-lens .word,
        .fx-wipe .word,
        .fx-abyss .word,
        .fx-aurora .word {
            vertical-align: baseline !important;
            line-height: 1 !important;
            display: inline-block;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* ========================================= */
        /* --- PRO WORSHIP (PER-WORD): NO SWIPES! --- */
        /* ========================================= */

        /* 1. BLOOM (Exposure Burn-in): Cahaya blinding yang terbakar lalu fokus menjadi teks */
        .fx-bloom .word {
            animation: wBloom var(--fade-speed) ease-out both;
            display: inline-block;
        }

        @keyframes wBloom {
            0% {
                opacity: 0;
                filter: brightness(10) blur(20px) contrast(3);
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                filter: brightness(1) blur(0) contrast(1);
                transform: scale(1);
            }
        }

        /* 2. SMOKE (Wavering Skew): Meliuk-liuk seperti asap ketiup angin (Tanpa geser posisi) */
        .fx-smoke .word {
            animation: wSmoke var(--fade-speed) ease-in-out both;
            display: inline-block;
        }

        @keyframes wSmoke {
            0% {
                opacity: 0;
                transform: skewX(-20deg) scale(1.05);
                filter: blur(10px);
            }

            50% {
                opacity: 0.5;
                transform: skewX(10deg) scale(1.02);
                filter: blur(4px);
            }

            100% {
                opacity: 1;
                transform: skewX(0deg) scale(1);
                filter: blur(0);
            }
        }

        /* 3. LIGHT (Iris Reveal): Muncul dari tengah seperti gerhana matahari / lensa iris */
        .fx-light .word {
            animation: wLight var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) both;
            display: inline-block;
        }

        @keyframes wLight {
            0% {
                opacity: 0;
                clip-path: circle(0% at 50% 50%);
                filter: drop-shadow(0 0 20px white);
            }

            100% {
                opacity: 1;
                clip-path: circle(150% at 50% 50%);
                filter: drop-shadow(0 0 0 transparent);
            }
        }

        /* 4. SOFTFOCUS (Deep 3D Tilt): Tidur terlentang, lalu bangun ke depan menatap penonton */
        .fx-softfocus .word {
            animation: wFocus var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
            display: inline-block;
            transform-origin: bottom center;
        }

        @keyframes wFocus {
            0% {
                opacity: 0;
                transform: perspective(600px) rotateX(85deg) scale(1.2);
                filter: blur(15px);
            }

            100% {
                opacity: 1;
                transform: perspective(600px) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        /* 5. FLOAT (Ghostly Convergence): Dua bayangan terpisah yang menyatu jadi satu kata */
        .fx-float .word {
            animation: wFloat var(--fade-speed) ease-out both;
            display: inline-block;
        }

        @keyframes wFloat {
            0% {
                opacity: 0;
                text-shadow: -30px 0 20px rgba(255, 255, 255, 0.6), 30px 0 20px rgba(255, 255, 255, 0.6);
                transform: scale(1.1);
                filter: blur(5px);
                color: transparent;
            }

            100% {
                opacity: 1;
                text-shadow: 0 0 0 transparent, 0 0 0 transparent;
                transform: scale(1);
                filter: blur(0);
                color: inherit;
            }
        }

        /* ========================================= */
        /* --- PRO PRAISE (PER-CHAR): EXTREME KINETIC --- */
        /* ========================================= */

        /* 6. PUNCH (Tornado Spin): Mutar dari jarak pandang jauh hingga menabrak layar */
        .fx-punch .char {
            animation: pPunch var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            display: inline-block;
        }

        @keyframes pPunch {
            0% {
                opacity: 0;
                transform: scale(4) rotate(180deg);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0);
            }
        }

        /* 7. ELASTIC (Squish & Squash): Memipih super gepeng horizontal lalu loncat normal (True Jelly) */
        .fx-elastic .char {
            animation: pElastic var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
            display: inline-block;
            transform-origin: center;
        }

        @keyframes pElastic {
            0% {
                opacity: 0;
                transform: scaleX(4) scaleY(0.1);
                filter: blur(5px);
            }

            40% {
                opacity: 1;
                transform: scaleX(0.5) scaleY(1.5);
                filter: blur(0);
            }

            70% {
                transform: scaleX(1.2) scaleY(0.9);
            }

            100% {
                opacity: 1;
                transform: scaleX(1) scaleY(1);
            }
        }

        /* 8. FLASHPOP (CRT TV On): Berawal dari garis cahaya super tipis lalu melebar jadi huruf */
        .fx-flashpop .char {
            animation: pFlash var(--fade-speed) cubic-bezier(0.1, 0.9, 0.2, 1) both;
            display: inline-block;
        }

        @keyframes pFlash {
            0% {
                opacity: 0;
                transform: scaleY(0.01) scaleX(5);
                filter: brightness(10) contrast(3);
                background: white;
                color: transparent;
            }

            50% {
                opacity: 1;
                transform: scaleY(1.2) scaleX(0.9);
                background: transparent;
                color: inherit;
                filter: brightness(2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        /* 9. WHIP (3D Door Slam): Berayun seperti pintu dibanting tutup dari samping */
        .fx-whip .char {
            animation: pWhip var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            display: inline-block;
            transform-origin: left;
        }

        @keyframes pWhip {
            0% {
                opacity: 0;
                transform: perspective(400px) rotateY(90deg) scale(1.5);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: perspective(400px) rotateY(0deg) scale(1);
                filter: blur(0);
            }
        }

        /* 10. GDROP (Giant Stomp): Karakter raksasa dari atas layar nge-stomp ke dalam layar */
        .fx-gdrop .char {
            animation: pDrop var(--fade-speed) cubic-bezier(0.5, 0, 0.1, 1) both;
            display: inline-block;
        }

        @keyframes pDrop {
            0% {
                opacity: 0;
                transform: scale(8);
                text-shadow: 0 0 50px red;
                filter: blur(10px);
            }

            80% {
                opacity: 1;
                transform: scale(0.9);
                text-shadow: 0 0 10px cyan;
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: 0 0 0 transparent;
            }
        }

        /* ========================================= */
        /* --- AE CINEMATIC WORSHIP (PER-WORD) --- */
        /* ========================================= */

        /* 1. DUST CLEAR: Simulasi partikel asap/debu yang mengendap */
        .fx-dust .word {
            animation: aeDust var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
            display: inline-block;
        }

        @keyframes aeDust {
            0% {
                opacity: 0;
                filter: blur(15px);
                transform: translateY(-20px) scale(1.05) skewX(10deg);
                text-shadow: 0 30px 20px rgba(255, 255, 255, 0.6);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0) scale(1) skewX(0);
                text-shadow: 0 0 0 transparent;
            }
        }

        /* 2. LENS FLARE: Silau ekstrem ala kamera anamorphic */
        .fx-lens .word {
            animation: aeLens var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) both;
            display: inline-block;
        }

        @keyframes aeLens {
            0% {
                opacity: 0;
                filter: brightness(5) blur(15px) contrast(2);
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                filter: brightness(1) blur(0) contrast(1);
                transform: scale(1);
            }
        }

        /* 3. CINEMATIC WIPE: Muncul disapu dari kiri ke kanan pakai masking */
        .fx-wipe .word {
            animation: aeWipe var(--fade-speed) cubic-bezier(0.65, 0, 0.15, 1) both;
            display: inline-block;
        }

        @keyframes aeWipe {
            0% {
                opacity: 0;
                clip-path: inset(0 100% 0 0);
                transform: translateX(-15px);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0 0);
                transform: translateX(0);
            }
        }

        /* 4. ABYSS RISE: Muncul dari jurang 3D (Z-Axis) */
        .fx-abyss .word {
            animation: aeAbyss var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) both;
            display: inline-block;
            transform-origin: top;
        }

        @keyframes aeAbyss {
            0% {
                opacity: 0;
                transform: perspective(800px) translateZ(-300px) rotateX(-60deg);
                filter: blur(15px);
            }

            100% {
                opacity: 1;
                transform: perspective(800px) translateZ(0) rotateX(0);
                filter: blur(0);
            }
        }

        /* 5. AURORA GLOW: Glow warna-warni perlahan memudar ke teks solid */
        .fx-aurora .word {
            animation: aeAurora var(--fade-speed) ease-out both;
            display: inline-block;
        }

        @keyframes aeAurora {
            0% {
                opacity: 0;
                filter: blur(10px);
                text-shadow: -20px 0 40px #00e5ff, 20px 0 40px #ff00ff;
                transform: scale(1.02);
            }

            100% {
                opacity: 1;
                filter: blur(0);
                text-shadow: 0 0 0 transparent;
                transform: scale(1);
            }
        }

        /* ========================================= */
        /* --- AE MOTION PRAISE (PER-CHAR) --- */
        /* ========================================= */

        /* 6. RGB GLITCH: Shadow Merah & Biru misah lalu nabrak bersatu */
        .fx-rgb .char {
            animation: aeRGB var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
            display: inline-block;
        }

        @keyframes aeRGB {
            0% {
                opacity: 0;
                transform: scale(1.2);
                text-shadow: -30px 0 10px red, 30px 0 10px cyan;
                filter: blur(5px);
            }

            50% {
                opacity: 1;
                text-shadow: 5px 0 0 red, -5px 0 0 cyan;
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: 0 0 0 transparent;
            }
        }

        /* 7. IMPACT SHAKE: Teks jatuh keras trus kameranya gempa (Shake) */
        .fx-shake .char {
            animation: aeShake var(--fade-speed) cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            display: inline-block;
        }

        @keyframes aeShake {
            0% {
                opacity: 0;
                transform: scale(2.5) translateY(-30px);
                filter: blur(10px);
            }

            40% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }

            50% {
                transform: translate(-4px, 4px);
            }

            60% {
                transform: translate(4px, -4px);
            }

            70% {
                transform: translate(-4px, -4px);
            }

            80% {
                transform: translate(4px, 4px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* 8. KINETIC SMASH: Muter dari sudut tajam lalu ngerem mendadak */
        .fx-smash .char {
            animation: aeSmash var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            display: inline-block;
        }

        @keyframes aeSmash {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-45deg) translateX(-50px);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0) translateX(0);
                filter: blur(0);
            }
        }

        /* 9. NINJA SLASH: Dipotong diagonal (Masking Polygon) trus nyatu */
        .fx-slash .char {
            animation: aeSlash var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) both;
            display: inline-block;
        }

        @keyframes aeSlash {
            0% {
                opacity: 0;
                clip-path: polygon(0 0, 100% 0, 100% 0, 0 0);
                transform: translateY(30px) skewX(40deg);
            }

            100% {
                opacity: 1;
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                transform: translateY(0) skewX(0);
            }
        }

        /* 10. TERMINAL TYPE: Ngetik instan ala koding Hacker (No fade) */
        .fx-terminal .char {
            animation: aeTerminal var(--fade-speed) steps(1, end) both;
            display: inline-block;
            border-right: 3px solid transparent;
        }

        @keyframes aeTerminal {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
                border-right-color: var(--main-color);
            }

            95% {
                opacity: 1;
                border-right-color: transparent;
            }

            100% {
                opacity: 1;
                border-right-color: transparent;
            }
        }

        /* ========================================================= */
        /* --- DEEP EFFECT: GROUPED ODD/EVEN WORD TRANSITIONS --- */
        /* Words 1,3,5... appear first; words 2,4,6... appear after */
        /* ========================================================= */

        /* BASE: Per-word inline display for all deep effects */
        .fx-smoke-deep .word,
        .fx-liquid .word,
        .fx-zoom-deep .word,
        .fx-glitch-deep .word,
        .fx-fisheye .word,
        .fx-radial-blur .word,
        .fx-chromatic .word,
        .fx-motion-blur .word,
        .fx-veil-lift .word,
        .fx-particle .word {
            display: inline-block;
            vertical-align: baseline !important;
            line-height: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            will-change: transform, opacity, filter;
        }

        /* 1. SMOKE DEEP: Asap mengepul berbarengan – odd naik dari kiri, even dari kanan */
        .fx-smoke-deep .word {
            animation: wSmokeDpOdd var(--fade-speed) cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .fx-smoke-deep .word:nth-child(even) {
            animation-name: wSmokeDpEven;
        }

        @keyframes wSmokeDpOdd {
            0% {
                opacity: 0;
                transform: skewX(-25deg) translateX(-10px) scale(1.08);
                filter: blur(14px);
            }

            60% {
                opacity: 0.8;
                transform: skewX(8deg) translateX(3px) scale(1.01);
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: skewX(0deg) translateX(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes wSmokeDpEven {
            0% {
                opacity: 0;
                transform: skewX(25deg) translateX(10px) scale(1.08);
                filter: blur(14px);
            }

            60% {
                opacity: 0.8;
                transform: skewX(-8deg) translateX(-3px) scale(1.01);
                filter: blur(2px);
            }

            100% {
                opacity: 1;
                transform: skewX(0deg) translateX(0) scale(1);
                filter: blur(0);
            }
        }

        /* 2. LIQUID: Cair dari atas – odd muncul normal, even terbalik (flip) */
        .fx-liquid .word {
            animation: wLiquidOdd var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
            transform-origin: center top;
        }

        .fx-liquid .word:nth-child(even) {
            animation-name: wLiquidEven;
            transform-origin: center bottom;
        }

        @keyframes wLiquidOdd {
            0% {
                opacity: 0;
                transform: perspective(400px) rotateX(-80deg) scale(1.1);
                filter: blur(8px);
            }

            70% {
                opacity: 1;
                transform: perspective(400px) rotateX(8deg) scale(0.98);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: perspective(400px) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        @keyframes wLiquidEven {
            0% {
                opacity: 0;
                transform: perspective(400px) rotateX(80deg) scale(1.1);
                filter: blur(8px);
            }

            70% {
                opacity: 1;
                transform: perspective(400px) rotateX(-8deg) scale(0.98);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: perspective(400px) rotateX(0deg) scale(1);
                filter: blur(0);
            }
        }

        /* 3. ZOOM DEEP: Odd words zoom in from 0, even words zoom in from large */
        .fx-zoom-deep .word {
            animation: wZoomDpIn var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .fx-zoom-deep .word:nth-child(even) {
            animation-name: wZoomDpOut;
        }

        @keyframes wZoomDpIn {
            0% {
                opacity: 0;
                transform: scale(0.2) translateZ(-200px);
                filter: blur(20px) brightness(3);
            }

            70% {
                opacity: 1;
                transform: scale(1.05) translateZ(5px);
                filter: blur(0) brightness(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateZ(0);
                filter: blur(0) brightness(1);
            }
        }

        @keyframes wZoomDpOut {
            0% {
                opacity: 0;
                transform: scale(3.5) translateZ(200px);
                filter: blur(25px) brightness(4);
            }

            70% {
                opacity: 1;
                transform: scale(0.97) translateZ(-5px);
                filter: blur(0) brightness(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateZ(0);
                filter: blur(0) brightness(1);
            }
        }

        /* 4. GLITCH DEEP: Odd snaps from top-left, even snaps from bottom-right with RGB split */
        .fx-glitch-deep .word {
            animation: wGlitchDpA var(--fade-speed) steps(3) both;
        }

        .fx-glitch-deep .word:nth-child(even) {
            animation-name: wGlitchDpB;
        }

        @keyframes wGlitchDpA {
            0% {
                opacity: 0;
                transform: translate(-12px, -8px) skewX(15deg);
                text-shadow: -8px 0 0 #ff0055, 8px 0 0 #00e5ff;
                filter: blur(4px);
            }

            33% {
                opacity: 1;
                transform: translate(4px, 2px) skewX(-5deg);
                text-shadow: 4px 0 0 #ff0055, -4px 0 0 #00e5ff;
                filter: blur(1px);
            }

            66% {
                opacity: 1;
                transform: translate(-2px, -1px) skewX(2deg);
                text-shadow: 1px 0 0 #ff0055, -1px 0 0 #00e5ff;
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) skewX(0deg);
                text-shadow: none;
                filter: blur(0);
            }
        }

        @keyframes wGlitchDpB {
            0% {
                opacity: 0;
                transform: translate(12px, 8px) skewX(-15deg);
                text-shadow: 8px 0 0 #ff00ff, -8px 0 0 #ffff00;
                filter: blur(4px);
            }

            33% {
                opacity: 1;
                transform: translate(-4px, -2px) skewX(5deg);
                text-shadow: -4px 0 0 #ff00ff, 4px 0 0 #ffff00;
                filter: blur(1px);
            }

            66% {
                opacity: 1;
                transform: translate(2px, 1px) skewX(-2deg);
                text-shadow: -1px 0 0 #ff00ff, 1px 0 0 #ffff00;
            }

            100% {
                opacity: 1;
                transform: translate(0, 0) skewX(0deg);
                text-shadow: none;
                filter: blur(0);
            }
        }

        /* 5. FISHEYE: Odd from exaggerated fisheye distortion, even from inverted barrel */
        .fx-fisheye .word {
            animation: wFisheyeA var(--fade-speed) cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .fx-fisheye .word:nth-child(even) {
            animation-name: wFisheyeB;
        }

        @keyframes wFisheyeA {
            0% {
                opacity: 0;
                transform: scale(2.2) perspective(200px) rotateY(-30deg);
                filter: blur(10px);
            }

            65% {
                opacity: 1;
                transform: scale(1.03) perspective(400px) rotateY(4deg);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1) perspective(400px) rotateY(0deg);
            }
        }

        @keyframes wFisheyeB {
            0% {
                opacity: 0;
                transform: scale(2.2) perspective(200px) rotateY(30deg);
                filter: blur(10px);
            }

            65% {
                opacity: 1;
                transform: scale(1.03) perspective(400px) rotateY(-4deg);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1) perspective(400px) rotateY(0deg);
            }
        }

        /* 6. RADIAL BLUR: Odd bursts from center outward, even implodes from outside inward */
        .fx-radial-blur .word {
            animation: wRadialBurstOut var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .fx-radial-blur .word:nth-child(even) {
            animation-name: wRadialBurstIn;
        }

        @keyframes wRadialBurstOut {
            0% {
                opacity: 0;
                transform: scale(0.1);
                filter: blur(30px) brightness(5);
            }

            50% {
                opacity: 0.9;
                transform: scale(1.08);
                filter: blur(2px) brightness(1.3);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0) brightness(1);
            }
        }

        @keyframes wRadialBurstIn {
            0% {
                opacity: 0;
                transform: scale(4.5);
                filter: blur(30px) brightness(0.3);
            }

            50% {
                opacity: 0.9;
                transform: scale(0.95);
                filter: blur(2px) brightness(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0) brightness(1);
            }
        }

        /* 7. CHROMATIC: RGB channel split – odd = red channel first, even = cyan channel first */
        .fx-chromatic .word {
            animation: wChromaticA var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        .fx-chromatic .word:nth-child(even) {
            animation-name: wChromaticB;
        }

        @keyframes wChromaticA {
            0% {
                opacity: 0;
                transform: scale(1.1);
                text-shadow: -15px 0 10px #ff0055, 15px 0 10px #00e5ff;
                filter: blur(6px);
            }

            40% {
                opacity: 1;
                text-shadow: -5px 0 4px #ff0055, 5px 0 4px #00e5ff;
                filter: blur(1px);
            }

            75% {
                text-shadow: -1px 0 0 #ff0055, 1px 0 0 #00e5ff;
            }

            100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: none;
                filter: blur(0);
            }
        }

        @keyframes wChromaticB {
            0% {
                opacity: 0;
                transform: scale(1.1);
                text-shadow: 15px 0 10px #ff00ff, -15px 0 10px #ffff00;
                filter: blur(6px);
            }

            40% {
                opacity: 1;
                text-shadow: 5px 0 4px #ff00ff, -5px 0 4px #ffff00;
                filter: blur(1px);
            }

            75% {
                text-shadow: 1px 0 0 #ff00ff, -1px 0 0 #ffff00;
            }

            100% {
                opacity: 1;
                transform: scale(1);
                text-shadow: none;
                filter: blur(0);
            }
        }

        /* 8. MOTION BLUR: Odd streaks from left with -5° tilt, even streaks from right with +5° tilt */
        .fx-motion-blur .word {
            animation: wMotionBlurL var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .fx-motion-blur .word:nth-child(even) {
            animation-name: wMotionBlurR;
        }

        @keyframes wMotionBlurL {
            0% {
                opacity: 0;
                transform: translateX(-60px) rotate(-5deg) scaleX(1.4);
                filter: blur(15px);
            }

            60% {
                opacity: 1;
                transform: translateX(3px) rotate(1deg) scaleX(0.99);
                filter: blur(1px);
            }

            100% {
                opacity: 1;
                transform: translateX(0) rotate(0deg) scaleX(1);
                filter: blur(0);
            }
        }

        @keyframes wMotionBlurR {
            0% {
                opacity: 0;
                transform: translateX(60px) rotate(5deg) scaleX(1.4);
                filter: blur(15px);
            }

            60% {
                opacity: 1;
                transform: translateX(-3px) rotate(-1deg) scaleX(0.99);
                filter: blur(1px);
            }

            100% {
                opacity: 1;
                transform: translateX(0) rotate(0deg) scaleX(1);
                filter: blur(0);
            }
        }

        /* 9. VEIL LIFT: Odd = iris open from center, even = veil falls away from top */
        .fx-veil-lift .word {
            animation: wVeilIris var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .fx-veil-lift .word:nth-child(even) {
            animation-name: wVeilFall;
        }

        @keyframes wVeilIris {
            0% {
                opacity: 0;
                clip-path: circle(0% at 50% 50%);
                filter: blur(12px) brightness(3);
            }

            60% {
                opacity: 1;
                clip-path: circle(75% at 50% 50%);
                filter: blur(2px) brightness(1.2);
            }

            100% {
                opacity: 1;
                clip-path: circle(200% at 50% 50%);
                filter: blur(0) brightness(1);
            }
        }

        @keyframes wVeilFall {
            0% {
                opacity: 0;
                clip-path: inset(0 0 100% 0);
                transform: translateY(-8px);
                filter: blur(10px);
            }

            60% {
                opacity: 1;
                clip-path: inset(0 0 0% 0);
                transform: translateY(3px);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                clip-path: inset(0 0 0% 0);
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* 10. PARTICLE: Odd from above with scatter, even from below – AE Particle-style */
        .fx-particle .word {
            animation: wParticleUp var(--fade-speed) cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .fx-particle .word:nth-child(even) {
            animation-name: wParticleDown;
        }

        @keyframes wParticleUp {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(1.3);
                filter: blur(12px) brightness(4);
            }

            60% {
                opacity: 1;
                transform: translateY(6px) scale(0.97);
                filter: blur(0) brightness(1.1);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0) brightness(1);
            }
        }

        @keyframes wParticleDown {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(1.3);
                filter: blur(12px) brightness(4);
            }

            60% {
                opacity: 1;
                transform: translateY(-6px) scale(0.97);
                filter: blur(0) brightness(1.1);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0) brightness(1);
            }
        }

        /* ============================================================= */
        /* --- WORSHIP PRO (CENTER-OUT WORD STAGGER) --- */
        /* Center word appears first, then ripples outward L & R */
        /* ============================================================= */

        .fx-holy-breathe .word,
        .fx-sanctify .word,
        .fx-ascend .word,
        .fx-mist-form .word,
        .fx-rapture .word {
            display: inline-block;
            vertical-align: baseline !important;
            line-height: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            will-change: transform, opacity, filter;
        }

        /* 1. HOLY BREATHE: Divine light materializes from center outward */
        .fx-holy-breathe .word {
            animation: wHolyBreathe var(--fade-speed) ease-out both;
        }

        @keyframes wHolyBreathe {
            0% {
                opacity: 0;
                transform: scale(0.7);
                filter: brightness(8) blur(18px);
            }

            55% {
                opacity: 1;
                transform: scale(1.04);
                filter: brightness(1.5) blur(0);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        /* 2. SANCTIFY: White-hot glow cools into color, center-out */
        .fx-sanctify .word {
            animation: wSanctify var(--fade-speed) cubic-bezier(0.25, 1, 0.5, 1) both;
        }

        @keyframes wSanctify {
            0% {
                opacity: 0;
                filter: brightness(10) saturate(0) blur(10px);
                transform: scale(1.1);
            }

            50% {
                opacity: 1;
                filter: brightness(2.5) saturate(0.4) blur(2px);
                transform: scale(1.02);
            }

            100% {
                opacity: 1;
                filter: brightness(1) saturate(1) blur(0);
                transform: scale(1);
            }
        }

        /* 3. ASCEND: Words rise with golden shimmer trail, center-out */
        .fx-ascend .word {
            animation: wAscend var(--fade-speed) cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes wAscend {
            0% {
                opacity: 0;
                transform: translateY(35px) scale(0.85);
                filter: blur(12px) brightness(4);
                text-shadow: 0 0 40px gold;
            }

            65% {
                opacity: 1;
                transform: translateY(-4px) scale(1.02);
                filter: blur(0) brightness(1.2);
                text-shadow: 0 0 8px gold;
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
                text-shadow: none;
            }
        }

        /* 4. MIST FORM: Mist coalesces from scattered angle, center-out */
        .fx-mist-form .word {
            animation: wMistForm var(--fade-speed) cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes wMistForm {
            0% {
                opacity: 0;
                transform: rotate(-18deg) scale(1.5);
                filter: blur(22px) brightness(2.5);
            }

            55% {
                opacity: 0.9;
                transform: rotate(4deg) scale(1.04);
                filter: blur(4px) brightness(1.2);
            }

            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1);
                filter: blur(0) brightness(1);
            }
        }

        /* 5. RAPTURE: Words descend from heaven with light beam, center-out */
        .fx-rapture .word {
            animation: wRapture var(--fade-speed) cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        @keyframes wRapture {
            0% {
                opacity: 0;
                transform: translateY(-55px) scale(1.25);
                filter: blur(18px) brightness(6);
            }

            60% {
                opacity: 1;
                transform: translateY(5px) scale(0.97);
                filter: blur(0) brightness(1.3);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: brightness(1);
            }
        }

        /* ============================================================= */
        /* --- PRAISE EXTREME (REVERSE CASCADE + VARIATION CHARS) --- */
        /* Last char appears first, ripples backward to first char */
        /* ============================================================= */

        .fx-shockwave .char,
        .fx-overdrive .char,
        .fx-nuke .char,
        .fx-voltage .char,
        .fx-riot .char {
            display: inline-block;
            vertical-align: baseline !important;
            line-height: 1 !important;
            margin: 0 !important;
            padding: 0 !important;
            will-change: transform, opacity, filter;
        }

        /* 6. SHOCKWAVE: Chars explode from microscale then snap back, reverse cascade */
        .fx-shockwave .char {
            animation: pShockwave var(--fade-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes pShockwave {
            0% {
                opacity: 0;
                transform: scale(6);
                filter: blur(10px) brightness(8);
            }

            55% {
                opacity: 1;
                transform: scale(0.88);
                filter: blur(0) brightness(1.4);
            }

            75% {
                transform: scale(1.06);
            }

            100% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(1);
            }
        }

        /* 7. OVERDRIVE: Chars slam from extreme horizontal skew, reverse cascade */
        .fx-overdrive .char {
            animation: pOverdrive var(--fade-speed) cubic-bezier(0.68, -0.55, 0.265, 1.55) both;
        }

        @keyframes pOverdrive {
            0% {
                opacity: 0;
                transform: skewX(-50deg) scaleX(4);
                filter: blur(12px) brightness(10);
            }

            55% {
                opacity: 1;
                transform: skewX(6deg) scaleX(0.96);
                filter: blur(0);
            }

            100% {
                opacity: 1;
                transform: skewX(0deg) scaleX(1);
            }
        }

        /* 8. NUKE: Chars implode from microscale then bounce, reverse cascade */
        .fx-nuke .char {
            animation: pNuke var(--fade-speed) cubic-bezier(0.5, -0.3, 0.1, 1.5) both;
        }

        @keyframes pNuke {
            0% {
                opacity: 0;
                transform: scale(0.01) translateY(-80px);
                filter: blur(20px) brightness(12);
            }

            45% {
                opacity: 1;
                transform: scale(1.4) translateY(12px);
                filter: blur(0) brightness(2);
            }

            72% {
                transform: scale(0.88) translateY(-5px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: brightness(1);
            }
        }

        /* 9. VOLTAGE: Electric crackling – odd from top, even from bottom (sequential) */
        .fx-voltage .char {
            animation: pVoltageA var(--fade-speed) steps(4) both;
        }

        .fx-voltage .char:nth-child(even) {
            animation-name: pVoltageB;
        }

        @keyframes pVoltageA {
            0% {
                opacity: 0;
                transform: translateY(-25px) scaleY(0.05);
                filter: brightness(15) blur(4px);
                color: #00e5ff;
            }

            25% {
                opacity: 1;
                transform: translateY(6px) scaleY(1.4);
                filter: brightness(4);
            }

            75% {
                transform: translateY(-2px) scaleY(1);
                filter: brightness(1.6);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scaleY(1);
                filter: brightness(1);
                color: inherit;
            }
        }

        @keyframes pVoltageB {
            0% {
                opacity: 0;
                transform: translateY(25px) scaleY(0.05);
                filter: brightness(15) blur(4px);
                color: #ffff00;
            }

            25% {

                transform: translateY(-6px) scaleY(1.4);
                filter: brightness(4);
            }

            75% {
                transform: translateY(2px) scaleY(1);
                filter: brightness(1.6);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scaleY(1);
                filter: brightness(1);
                color: inherit;
            }

        /* 10. RIOT: Chars spin from 3 rotating angles in chaotic rhythm (sequential) */
        .fx-riot .char {

        }

        .fx-riot .char:nth-child(3n+1) {
            animation-name: pRiotB;
        }

        .fx-riot .char:nth-child(3n+2) {
            animation-name: pRiotC;
        }

        @keyframes pRiotA {
            0% {
                opacity: 0;
                transform: rotate(-200deg) scale(3.5) translateX(-25px);
                filter: blur(8px);
            }

            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1) translateX(0);
                filter: blur(0);
            }
        }

        @keyframes pRiotB {
            0% {
                opacity: 0;
                transform: rotate(200deg) scale(3.5) translateY(-25px);
                filter: blur(8px);
            }

            100% {
                opacity: 1;
                transform: rotate(0deg) scale(1) translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pRiotC {
            0% {
                opacity: 0;
                transform: rotate(-90deg) scale(0.1) translateX(25px);
                filter: blur(8px);
            }

            100% {
                opacity: 1;

                filter: blur(0);
            }

        /* ========================================= */
        /* --- PRO MOTION LOOPS (SUBTLE & ELEGANT) --- */
        /* ========================================= */

        /* 1. LAZY: Melayang vertikal super lambat (Ambient Float) */
        .loop-lazy {
            animation: proLazy 8s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate;
        }

        @keyframes proLazy {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.1));
            }

            100% {
                transform: translateY(-10px);
                filter: drop-shadow(0 15px 25px rgba(255, 255, 255, 0.3));
            }
        }

        /* 2. JINGLE: Bernapas pelan, membesar/mengecil (Cinematic Breathe) */
        .loop-jingle {
            animation: proBreathe 4s ease-in-out infinite alternate;
        }

        @keyframes proBreathe {
            0% {
                transform: scale(1);
                opacity: 0.9;
            }

            100% {
                transform: scale(1.02);
                opacity: 1;
            }
        }

        /* 3. GRUNGE: Getaran analog yang sangat halus (VHS Tracking micro-shake) */
        .loop-grunge {
            animation: proGrunge 0.2s infinite;
        }

        @keyframes proGrunge {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-1px, 1px) skewX(0.5deg);
            }
        }

        /* 4. STROBE: Denyut cahaya ambient (Glow Pulse), BUKAN kedip layar */
        .loop-strobe {
            animation: proGlowPulse 2.5s ease-in-out infinite alternate;
        }

        @keyframes proGlowPulse {
            0% {
                filter: drop-shadow(0 0 5px var(--main-color));
                opacity: 0.85;
            }

            100% {
                filter: drop-shadow(0 0 30px var(--main-color)) brightness(1.2);
                opacity: 1;
            }
        }

        /* 5. NEON PULSE: Perubahan warna Hue yang sangat lambat dan tipis (Aura Shift) */
        .loop-pulse-neon {
            animation: proAura 10s linear infinite alternate;
        }

        @keyframes proAura {
            0% {
                filter: hue-rotate(-10deg) brightness(1);
            }

            100% {
                filter: hue-rotate(10deg) brightness(1.1);
            }
        }

        /* 6. EARTHQUAKE: Efek "Handheld Camera" (kamera dipegang tangan, goyang lambat) */
        .loop-earthquake {
            animation: proHandheld 6s ease-in-out infinite;
        }

        @keyframes proHandheld {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            25% {
                transform: translate(2px, -1px) rotate(0.2deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-0.2deg);
            }

            75% {
                transform: translate(-2px, -2px) rotate(0.1deg);
            }
        }

        /* 7. HYPNOTIC: Efek Parallax 3D yang sangat tipis merespon seolah ada lensa */
        .loop-hypnotic {
            animation: proParallax 8s ease-in-out infinite alternate;
            transform-style: preserve-3d;
        }

        @keyframes proParallax {
            0% {
                transform: perspective(1000px) rotateX(-2deg) rotateY(2deg);
            }

            100% {
                transform: perspective(1000px) rotateX(2deg) rotateY(-2deg);
            }
        }

        /* 8. SONAR PING: Garis tepi (stroke) cahaya yang muncul berkala (Edge Scan) */
        .loop-sonar {
            animation: proScan 4s cubic-bezier(0.1, 0.9, 0.2, 1) infinite;
        }

        @keyframes proScan {

            0%,
            80% {
                text-shadow: 0 0 0 transparent;
                transform: scale(1);
            }

            85% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
                transform: scale(1.01);
            }

            100% {
                text-shadow: 0 0 40px rgba(255, 255, 255, 0);
                transform: scale(1);
            }
        }

        /* 9. RGB GLITCH: Glitch Subtil, cuma misah 1-2 pixel jarang-jarang (Tasteful Glitch) */
        .loop-glitch-rgb {
            animation: proRGB 5s infinite;
        }

        @keyframes proRGB {

            0%,
            96%,
            100% {
                filter: drop-shadow(0 0 0 transparent);
                transform: translateX(0);
            }

            97% {
                filter: drop-shadow(-2px 0 0 rgba(255, 0, 0, 0.5)) drop-shadow(2px 0 0 rgba(0, 255, 255, 0.5));
                transform: translateX(1px);
            }

            98% {
                filter: drop-shadow(2px 0 0 rgba(255, 0, 0, 0.5)) drop-shadow(-2px 0 0 rgba(0, 255, 255, 0.5));
                transform: translateX(-1px);
            }
        }

        /* 10. VERTIGO: Blur horizontal yang sesekali lewat (Wind/Speed effect) */
        .loop-vertigo {
            animation: proWind 4s ease-in-out infinite;
        }

        @keyframes proWind {

            0%,
            40%,
            100% {
                filter: blur(0);
            }

            50% {
                filter: blur(2px) contrast(1.1);
                transform: skewX(-5deg);
            }
        }
