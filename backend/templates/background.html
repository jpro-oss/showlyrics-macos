<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Engine</title>
    <!-- [OPT] Preconnect ke playback engine port 18899:
         Browser akan membuka TCP connection lebih awal (saat parse HTML),
         mengurangi cold-start latency saat video pertama kali di-load. -->
    <link rel="preconnect" href="http://localhost:18899">
    <link rel="dns-prefetch" href="http://localhost:18899">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;

            /* PERF: #000 (bukan transparent) agar compositor tidak perlu alpha-blend
               setiap frame. Iframe opaque = satu GPU layer stabil, tidak perlu composite
               dengan layer di bawahnya. Hasilnya: black saat tidak ada video (benar untuk projector) */
            background-color: transparent;
            overflow: hidden;

            /* Force full-viewport GPU hardware compositing and 3D rendering context.
               KRUSIAL untuk multi-window: preserve-3d + perspective menciptakan
               3D compositing context yang dipakai Chrome compositor untuk efisiensi. */
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            perspective: 1000px;
            -webkit-perspective: 1000;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .bg-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            background-color: transparent;
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            perspective: 1000px;
            -webkit-perspective: 1000;
        }
    </style>
</head>

<body>
    <!--
        preload="metadata" → hemat memori & bandwidth saat idle.
        Akan di-upgrade ke "auto" secara JS tepat sebelum transisi dimulai.
    -->
    <video id="vid1" class="bg-player" muted loop playsinline preload="metadata" disablepictureinpicture crossorigin="anonymous"></video>
    <video id="vid2" class="bg-player" muted loop playsinline preload="metadata" disablepictureinpicture crossorigin="anonymous"></video>

    <script src="/static/background.js?v={{ VERSION }}"></script>
</body>

</html>
