<!DOCTYPE html>
<html lang="en">

<head>
    <title>Photo Engine</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
        }

        #photo-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            will-change: opacity;
        }

        #photo-viewer.active {
            opacity: 1;
        }

        /* Hide broken/missing images completely */
        #photo-viewer[data-broken="true"],
        img:not([src]),
        img[src=""],
        img[src="null"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>

<body>
    <img id="photo-viewer" data-broken="false">
    <script src="/static/photo.js?v={{ VERSION }}"></script>
</body>

</html>
