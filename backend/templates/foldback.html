<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background-color: #000;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* LAYOUT */
        #top-section {
            flex: 1;
            /* Isi sisa ruang */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            /* Padding kiri kanan aman */
            text-align: center;
            overflow: hidden;
            /* Sembunyikan kalau ada glitch dikit */
            position: relative;
            z-index: 2;
        }

        #top-section.shift-down {
            padding-top: var(--rundown-box-height, 14vh) !important;
        }

        #bottom-section {
            height: 25vh;
            /* Next Lyrics Jauh lebih tinggi sekarang */
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: #888;
            border-top: 4px solid #333;
            text-align: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        /* TEXT STYLES */
        .current-text {
            color: #fff;
            font-weight: 900;
            line-height: 1.1;
            white-space: pre-wrap;
            /* Font size diatur JS */
            width: 100%;
        }

        .next-label {
            font-size: 5vh;
            color: #ffc107;
            text-transform: uppercase;
            font-weight: bold;
        }

        .next-text {
            font-weight: bold;
            line-height: 1.1;
            white-space: pre-wrap;
            color: #aaa;
            width: 100%;
            /* Font size diatur JS juga */
        }

        /* CLOCK */
        #clock {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 5vh;
            font-weight: 900;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 20px;
            border-bottom-left-radius: 15px;
            z-index: 10;
        }

        #stage-countdown-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15vw;
            font-weight: 900;
            color: #ff3333;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 50px;
            border: 5px solid #ff3333;
            border-radius: 20px;
            display: none;
            z-index: 300;
        }

        /* STAGE MESSAGE (POPUP) */
        #stage-msg-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            padding: 40px;
            background: #ffc107;
            color: #000;
            font-size: 8vw;
            font-weight: 900;
            text-align: center;
            border: 5px solid #fff;
            border-radius: 20px;
            display: none;
            z-index: 200;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .flash {
            animation: flasher 0.5s infinite alternate;
        }

        @keyframes flasher {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.2;
            }
        }

        /* ALERT CRAWL (Mirroring Main Display) */
        #fb-alert-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #8b0000;
            color: #fff;
            font-size: 3vh;
            font-weight: bold;
            padding: 5px;
            text-align: center;
            display: none;
            z-index: 100;
        }

        /* Hide broken images completely - no broken icon visible */
        #fb-video[data-broken="true"],
        #fb-photo[data-broken="true"],
        #fb-ppt[data-broken="true"],
        img:not([src]),
        img[src=""],
        img[src="null"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* STAGE RUNDOWN BOX styles */
        #fb-rundown-box {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffffff;
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            display: flex;
        }

        #fb-rundown-box.small-mode {
            top: 2vh;
            left: 2vw;
            transform: none;
            border-width: 3px;
            border-radius: 10px;
            padding: 8px 25px;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.95);
            border-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        #fb-rundown-box.small-mode #fb-rundown-timer {
            color: #00e5ff;
            font-weight: 900;
            order: 1;
            white-space: nowrap;
        }

        #fb-rundown-box.small-mode #fb-rundown-title {
            color: #ff9800;
            font-weight: 900;
            order: 2;
        }

        #fb-rundown-box.small-mode #fb-rundown-title::before {
            content: " - ";
            color: #fff;
            margin-right: 12px;
            font-weight: 900;
        }

        #fb-rundown-box.fullscreen-mode {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-width: 5px;
            border-radius: 24px;
            padding: 30px 60px;
            background: rgba(0, 0, 0, 0.95);
            border-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #fb-rundown-box.fullscreen-mode #fb-rundown-title {
            color: #ff9800;
            margin-bottom: 20px;
            font-weight: 900;
            order: 1;
            white-space: nowrap;
        }

        #fb-rundown-box.fullscreen-mode #fb-rundown-timer {
            color: #00e5ff;
            font-weight: 900;
            order: 2;
            white-space: nowrap;
        }

        #fb-rundown-box.fullscreen-mode #fb-rundown-title::before {
            content: none;
        }

        #fb-rundown-box.flash {
            animation: bg-flasher 1.0s infinite alternate;
        }

        @keyframes bg-flasher {
            from {
                background: var(--flash-bg, rgba(220, 53, 69, 0.9));
            }
            to {
                background: rgba(0, 0, 0, 0.95);
            }
        }
    </style>
    <script src="/static/wm.js?v={{ VERSION }}"></script>
</head>

<body>

    <div id="fb-rundown-box" class="fullscreen-mode"
        style="display: none; z-index: 500; font-family: 'Arial', sans-serif;">
        <div id="fb-rundown-title">-</div>
        <div id="fb-rundown-timer">00:00:00</div>
    </div>

    <div id="clock">00:00</div>
    <div id="stage-countdown-box" style="will-change: opacity;">00:00</div>
    <div id="fb-alert-bar">⚠ AUDIENCE ALERT: <span id="fb-alert-text"></span></div>
    <div id="stage-msg-box"></div>

    <!-- NEW FOLDBACK MEDIA ELEMENTS -->
    <div id="fb-media-label"
        style="position:absolute; top:2vh; left:2vw; font-size:3vh; color:#fff; font-weight:bold; z-index:10; background:rgba(0,0,0,0.7); padding:5px 15px; border-radius:10px; display:none; max-width:40vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
    </div>

    <video id="fb-video" autoplay loop muted data-broken="false"
        style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; display:none; z-index:9997; opacity:0.6; pointer-events:none; will-change: opacity;"></video>
    <img id="fb-photo" data-broken="false"
        style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; display:none; z-index:9998; opacity:0.6; pointer-events:none; will-change: opacity;">
    <img id="fb-ppt" data-broken="false"
        style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; display:none; z-index:9999; opacity:0.8; pointer-events:none; will-change: opacity;">

    <div id="top-section">
        <div id="curr-txt" class="current-text">WAITING...</div>
    </div>

    <div id="bottom-section">
        <div id="next-txt" class="next-text">Ready</div>
    </div>

    <script src="/static/foldback.js?v={{ VERSION }}"></script>
</body>

</html>
