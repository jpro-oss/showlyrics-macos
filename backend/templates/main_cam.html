<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Camera Output</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #cam-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Important for camera movement behind mask */
            will-change: mask-position, -webkit-mask-position;
        }

        video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* Fit Modes */
        .fit-fit {
            object-fit: contain;
        }

        .fit-fill {
            object-fit: cover;
        }

        .fit-stretch {
            object-fit: fill;
        }

        .hidden {
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="cam-container">
        <video id="video-el" autoplay playsinline muted class="hidden"></video>
    </div>

    <script src="/static/mcam.js?v={{ VERSION }}"></script>
</body>

</html>
