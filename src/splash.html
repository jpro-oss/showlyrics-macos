<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
    <title>ShowLyrics - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ============================================ */
        /* MACOS SEAMLESS ULTRA-PREMIUM GLASS WINDOW   */
        /* ============================================ */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* Seamless Glass Window Styling (Fills 450x300 window) */
            background: linear-gradient(145deg, rgba(22, 25, 37, 0.98) 0%, rgba(12, 14, 21, 0.99) 100%);

            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);

            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            animation: windowFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Glass Surface Reflection Highlight across top edge */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* Ambient Glowing Color Orbs */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            transform: translateZ(0);
        }

        .ambient-orb-blue {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.18) 0%, rgba(59, 130, 246, 0) 70%);
            top: -100px;
            left: -80px;
        }

        .ambient-orb-purple {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0) 70%);
            bottom: -80px;
            right: -60px;
        }

        /* ============================================ */
        /* CENTERED CONTENT WRAPPER                     */
        /* ============================================ */
        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 370px;
            gap: 23px;
        }

        /* ============================================ */
        /* LOGO & BRAND SECTION                         */
        /* ============================================ */
        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .logo-box {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                0 0 20px rgba(59, 130, 246, 0.2);

            animation: floatSmooth 4s ease-in-out infinite;
            will-change: transform;
            transform: translateZ(0);
            padding: 6px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-title {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
        }

        .brand-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-tagline {
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #888890;
            font-weight: 600;
        }

        .version-pill {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.18) 0%, rgba(139, 92, 246, 0.12) 100%);
            border: 1px solid rgba(96, 165, 250, 0.35);
            border-radius: 6px;
            font-size: 9.5px;
            color: #3b82f6;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow:
                0 2px 8px rgba(59, 130, 246, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* ============================================ */
        /* LOADING INDICATOR - SLEEK GLASS BAR          */
        /* ============================================ */
        .loading-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 2px;
            animation: progressAnimation 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.6);
            will-change: width;
            transform: translateZ(0);
        }

        /* Status Text Styling */
        .status-box {
            text-align: center;
        }

        .status-label {
            font-size: 10px;
            font-weight: 500;
            color: #e0e0e6;
            letter-spacing: 0.3px;
            margin-bottom: 3px;
        }

        .status-detail {
            font-size: 9px;
            color: #6b7080;
            letter-spacing: 0.2px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
        }

        .loading-dots-text {
            display: inline-block;
            width: 18px;
            text-align: left;
        }

        .dot-text {
            animation: textBlink 1.4s infinite;
        }

        .dot-text:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot-text:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ============================================ */
        /* FOOTER (STICKY AT BOTTOM)                    */
        /* ============================================ */
        .footer-text {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            font-size: 9.5px;
            color: #4a4a52;
            letter-spacing: 0.2px;
            text-align: center;
            font-weight: 400;
            z-index: 2;
        }

        /* ============================================ */
        /* ANIMATIONS                                   */
        /* ============================================ */
        @keyframes windowFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes floatSmooth {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes progressAnimation {
            0% {
                width: 0%;
                left: 0;
            }

            50% {
                width: 70%;
                left: 0;
            }

            100% {
                width: 100%;
                left: 0;
            }
        }

        @keyframes textBlink {

            0%,
            60%,
            100% {
                opacity: 0.4;
            }

            30% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Ambient Background Color Orbs -->
    <div class="ambient-orb ambient-orb-blue"></div>
    <div class="ambient-orb ambient-orb-purple"></div>

    <!-- DEAD-CENTERED CONTENT WRAPPER -->
    <div class="content-wrapper">
        <!-- LOGO & BRAND SECTION -->
        <div class="brand-container">
            <div class="logo-box">
                <img src="app.ico" alt="ShowLyrics Logo">
            </div>
            <div class="brand-info">
                <div class="brand-title">SHOWLYRICS</div>
                <div class="brand-meta">
                    <span class="brand-tagline">Worship Presentation</span>
                    <span class="version-pill">V 1.35.3 - BETA</span>
                </div>
            </div>
        </div>

        <!-- LOADING INDICATOR -->
        <div class="loading-container">
            <!-- Progress Bar -->
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>

            <!-- Status Messages -->
            <div class="status-box">
                <div class="status-label">
                    <span>Initializing</span><span class="loading-dots-text"><span class="dot-text">.</span><span
                            class="dot-text">.</span><span class="dot-text">.</span></span>
                </div>
                <div class="status-detail">Starting backend services</div>
            </div>
        </div>
    </div>

    <!-- FOOTER STICKY AT BOTTOM -->
    <div class="footer-text">
        © 2026 ShowLyrics • Professional Worship Presentation System
    </div>
</body>

</html>
